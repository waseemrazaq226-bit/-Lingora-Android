name: LINGORA Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
         packages: ''
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: |
          python3 -m venv "${RUNNER_TEMP}/lingora-venv"
          "${RUNNER_TEMP}/lingora-venv/bin/pip" install Pillow
          PATH="${RUNNER_TEMP}/lingora-venv/bin:${PATH}" python3 scripts/prepare_android.py
          test -x android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: node --test backend/server.test.mjs
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: LINGORA-1.0.0-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
